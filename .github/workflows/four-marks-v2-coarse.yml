name: Four Marks v2 sustained coarse checkpoint

on:
  push:
    branches:
      - gis-four-marks-v2-20260804
    paths:
      - '.github/workflows/four-marks-v2-coarse.yml'

permissions:
  contents: write

jobs:
  coarse:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gis-four-marks-v2-20260804
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS dependencies
        run: python -m pip install numpy pandas requests rasterio scipy pyproj shapely folium matplotlib
      - name: Run sustained-profile coarse screen
        run: |
          sed -i 's/dist<800/dist<600/' analysis/four_marks_gis/run_analysis.py
          sed -i 's/dist<(850 if white/dist<(650 if white/' analysis/four_marks_gis/run_analysis.py
          sed -i 's/np.arange(0,360,5)/np.arange(20,101,5)/' analysis/four_marks_gis/run_analysis.py
          rm -rf analysis/four_marks_gis/v2_coarse_checkpoint
          GIS_OUTPUT=analysis/four_marks_gis/v2_coarse_checkpoint python - <<'PY'
          from pathlib import Path
          import concurrent.futures as cf
          import json
          import pandas as pd
          import analysis.four_marks_gis.run_analysis as r
          import analysis.four_marks_gis.run_v2 as v2
          r.OUT=Path('analysis/four_marks_gis/v2_coarse_checkpoint')
          r.CACHE=Path('/tmp/four_marks_v2_coarse_cache')
          r.OUT.mkdir(parents=True,exist_ok=True)
          (r.OUT/'profiles').mkdir(exist_ok=True)
          b,face,tr,res=r.benchmark_whitewool()
          tiles=r.coarse_tiles()
          rows=[]
          with cf.ThreadPoolExecutor(max_workers=10) as ex:
              for result in ex.map(lambda t:v2.process_coarse_v2(t,b),tiles):
                  rows.extend(result)
          dedup=r.dedup(rows)
          pd.DataFrame(dedup).to_csv(r.OUT/'preliminary_components.csv',index=False)
          summary={'coarse_tiles':len(tiles),'raw_sustained_components':len(rows),'deduplicated_components':len(dedup),'sent_to_1m_verification':len(dedup),'whitewool_representative_slope_deg':b['representative_slope_deg'],'whitewool_relief_m':b['vertical_relief_m'],'whitewool_minimum_ridge_length_m':b['minimum_ridge_length_m']}
          (r.OUT/'coarse_summary.json').write_text(json.dumps(summary,indent=2))
          print(summary)
          PY
      - name: Commit checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/four_marks_gis/v2_coarse_checkpoint
          git diff --cached --quiet || git commit -m 'Add v2 sustained coarse checkpoint [gis-output]'
          git push
