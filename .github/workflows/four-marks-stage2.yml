name: Four Marks Stage 2 paragliding ranking

on:
  workflow_dispatch:
  push:
    branches:
      - gis-four-marks-revised-20260804
    paths:
      - 'analysis/four_marks_gis/stage2_paragliding_rank.py'
      - 'analysis/four_marks_gis/stage2_trigger.txt'

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gis-four-marks-revised-20260804
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas folium

      - name: Run Stage 2 paragliding ranking
        run: python analysis/four_marks_gis/stage2_paragliding_rank.py

      - name: Upload Stage 2 results
        uses: actions/upload-artifact@v4
        with:
          name: four-marks-stage2-top100
          path: analysis/four_marks_gis/output_stage2/
          if-no-files-found: error

      - name: Commit Stage 2 results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/four_marks_gis/output_stage2
          if git diff --cached --quiet; then
            echo 'No Stage 2 changes to commit.'
          else
            git commit -m 'Add Stage 2 Four Marks paragliding top 100 results'
            git push origin HEAD:gis-four-marks-revised-20260804
          fi
