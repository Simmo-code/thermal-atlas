name: Whitewool candidate context check

on:
  pull_request:
    branches: [main]
    paths:
      - analysis/whitewool_candidate_context.py
      - .github/workflows/whitewool-candidate-context.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install context dependencies
        run: python -m pip install pandas requests pillow
      - name: Reverse-geocode, query OSM and download satellite context
        run: python analysis/whitewool_candidate_context.py
      - name: Upload context outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whitewool-candidate-context
          path: whitewool_context_output
          if-no-files-found: warn
          retention-days: 14
