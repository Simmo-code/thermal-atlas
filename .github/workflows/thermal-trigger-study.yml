name: Thermal trigger GIS study

on:
  push:
    branches:
      - analysis/thermal-trigger-study
    paths:
      - analysis/run_thermal_trigger_gis.py
      - analysis/thermal_trigger_points_min.csv
      - .github/workflows/thermal-trigger-study.yml

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: analysis/thermal-trigger-study
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install GIS dependencies
        run: pip install pandas numpy requests shapely pyproj scipy statsmodels
      - name: Run OSM case-control analysis
        run: python analysis/run_thermal_trigger_gis.py
      - name: Commit results to analysis branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/thermal_trigger_metrics.csv analysis/thermal_trigger_summary.json analysis/mere_thermal_trigger_metrics.csv
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Add thermal trigger GIS results"
            git push origin HEAD:analysis/thermal-trigger-study
          fi
