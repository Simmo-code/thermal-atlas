name: Whitewool benchmark checkpoint

on:
  push:
    branches:
      - gis-four-marks-20260804
    paths:
      - '.github/workflows/four-marks-whitewool-benchmark.yml'

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gis-four-marks-20260804
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS dependencies
        run: python -m pip install numpy pandas requests rasterio scipy pyproj shapely folium matplotlib
      - name: Measure Whitewool
        run: |
          rm -rf analysis/four_marks_gis/benchmark_checkpoint
          sed -i 's/dist<800/dist<600/' analysis/four_marks_gis/run_analysis.py
          sed -i 's/dist<(850 if white/dist<(650 if white/' analysis/four_marks_gis/run_analysis.py
          sed -i 's/np.arange(0,360,5)/np.arange(20,101,5)/' analysis/four_marks_gis/run_analysis.py
          GIS_OUTPUT=analysis/four_marks_gis/benchmark_checkpoint python - <<'PY'
          from pathlib import Path
          import analysis.four_marks_gis.run_analysis as r
          r.OUT=Path('analysis/four_marks_gis/benchmark_checkpoint')
          r.CACHE=Path('/tmp/four_marks_benchmark_cache')
          r.OUT.mkdir(parents=True,exist_ok=True)
          (r.OUT/'profiles').mkdir(exist_ok=True)
          b,face,tr,res=r.benchmark_whitewool()
          print({k:b[k] for k in ['representative_slope_deg','median_local_slope_deg','max_robust_slope_deg','vertical_relief_m','ridge_length_m','aspect','percent_face_at_benchmark']})
          PY
      - name: Commit checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/four_marks_gis/benchmark_checkpoint
          git diff --cached --quiet || git commit -m 'Add corrected Whitewool benchmark checkpoint [gis-output]'
          git push
