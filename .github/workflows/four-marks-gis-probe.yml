name: Four Marks GIS WCS probe

on:
  push:
    branches:
      - gis-four-marks-20260804
    paths:
      - '.github/workflows/four-marks-gis-probe.yml'
      - 'analysis/four_marks_gis/**'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gis-four-marks-20260804
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal jq
      - name: Download Whitewool exact and scaled probes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p analysis/four_marks_gis/probe
          BASE='https://environment.data.gov.uk/spatialdata/lidar-composite-digital-terrain-model-dtm-1m/wcs?service=WCS&version=2.0.1&request=GetCoverage&coverageId=13787b9a-26a4-4775-8523-806d13af58fc__Lidar_Composite_Elevation_DTM_1m&subset=E(464000,466000)&subset=N(119400,121400)&format=image/tiff'
          curl -L --fail --retry 4 --retry-all-errors --connect-timeout 30 --max-time 1200 "$BASE" -o /tmp/whitewool_exact.tif
          curl -L --fail --retry 4 --retry-all-errors --connect-timeout 30 --max-time 1200 "${BASE}&scaleFactor=0.1" -o /tmp/whitewool_10m.tif
          gdalinfo -json /tmp/whitewool_exact.tif > /tmp/exact.json
          gdalinfo -json /tmp/whitewool_10m.tif > /tmp/scaled.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          exact=json.loads(Path('/tmp/exact.json').read_text())
          scaled=json.loads(Path('/tmp/scaled.json').read_text())
          out={
              'exact_size': exact.get('size'),
              'exact_geoTransform': exact.get('geoTransform'),
              'exact_file_size_bytes': Path('/tmp/whitewool_exact.tif').stat().st_size,
              'scaled_size': scaled.get('size'),
              'scaled_geoTransform': scaled.get('geoTransform'),
              'scaled_file_size_bytes': Path('/tmp/whitewool_10m.tif').stat().st_size,
              'coordinateSystem': exact.get('coordinateSystem',{}).get('wkt','')[:300],
              'cornerCoordinates': exact.get('cornerCoordinates'),
          }
          Path('analysis/four_marks_gis/probe/probe_summary.json').write_text(json.dumps(out,indent=2))
          PY
      - name: Commit probe result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/four_marks_gis/probe/probe_summary.json
          git diff --cached --quiet || git commit -m 'Record EA WCS scaling probe [skip ci]'
          git push
