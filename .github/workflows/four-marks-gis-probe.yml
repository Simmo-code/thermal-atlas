name: Four Marks GIS terrain analysis

on:
  push:
    branches:
      - gis-four-marks-20260804
    paths:
      - '.github/workflows/four-marks-gis-probe.yml'
      - 'analysis/four_marks_gis/**'

permissions:
  contents: write

jobs:
  analyse:
    if: ${{ !contains(github.event.head_commit.message, '[gis-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gis-four-marks-20260804
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install GIS dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests rasterio scipy pyproj shapely folium matplotlib
      - name: Run Whitewool benchmark and 30-mile terrain screen
        env:
          GIS_OUTPUT: analysis/four_marks_gis/output
          GIS_CACHE: /tmp/four_marks_gis_cache
        run: |
          set -euxo pipefail
          rm -rf analysis/four_marks_gis/output
          python -m py_compile analysis/four_marks_gis/run_analysis.py
          python analysis/four_marks_gis/run_analysis.py 2>&1 | tee analysis/four_marks_gis/run.log
          cd analysis/four_marks_gis
          zip -r four_marks_gis_results.zip output run.log
      - name: Commit analysis outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/four_marks_gis/output analysis/four_marks_gis/run.log analysis/four_marks_gis/four_marks_gis_results.zip
          git diff --cached --quiet || git commit -m 'Add Four Marks GIS terrain results [gis-output]'
          git push
